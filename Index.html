<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New India Banca Mediclaim Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for aesthetic */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Smooth transitions */
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">New India Banca Mediclaim Calculator</h1>
            <p class="text-blue-200 text-sm hidden sm:block">Instant Quote & Benefit Guide</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-2">Policy Configuration</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Geographic Zone</label>
                        <select id="zone" class="w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                            <option value="zone1">Zone 1 (Delhi/NCR, Mumbai, Surat, Ahmedabad, etc.)</option>
                            <option value="zone2">Zone 2 (Rest of India)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Sum Insured (₹)</label>
                        <select id="sumInsured" class="w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                            <option value="500000">₹ 5,00,000</option>
                            <option value="1000000">₹ 10,00,000</option>
                            <option value="1500000">₹ 15,00,000</option>
                            <option value="2500000">₹ 25,00,000</option>
                            <option value="5000000">₹ 50,00,000</option>
                            <option value="7500000">₹ 75,00,000</option>
                            <option value="10000000">₹ 1,00,00,000 (1 Crore)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Policy Term</label>
                        <select id="term" class="w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                            <option value="1">1 Year (0% discount)</option>
                            <option value="2">2 Years (5% discount)</option>
                            <option value="3">3 Years (7% discount)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Plan Variant</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="plan" value="basic" checked class="peer sr-only">
                                <div class="text-center py-2 px-3 border rounded-md text-sm peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 hover:bg-slate-50 transition-all">Basic</div>
                            </label>
                            <label class="cursor-pointer" id="label-gold">
                                <input type="radio" name="plan" value="gold" id="radio-gold" class="peer sr-only">
                                <div class="text-center py-2 px-3 border rounded-md text-sm peer-checked:bg-yellow-500 peer-checked:text-white peer-checked:border-yellow-500 hover:bg-slate-50 transition-all" id="ui-gold">Gold</div>
                            </label>
                            <label class="cursor-pointer" id="label-platinum">
                                <input type="radio" name="plan" value="platinum" id="radio-platinum" class="peer sr-only">
                                <div class="text-center py-2 px-3 border rounded-md text-sm peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800 hover:bg-slate-50 transition-all" id="ui-platinum">Platinum</div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-slate-800">Family Members</h2>
                    <span class="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded">Max 4 Members</span>
                </div>

                <div id="membersContainer" class="space-y-3">
                    </div>

                <button id="addMemberBtn" class="mt-4 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded border border-slate-300 transition-colors flex justify-center items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    Add Member
                </button>

                <div id="validationNotices" class="mt-4 space-y-2"></div>
            </div>

        </div>

        <div class="lg:col-span-7 space-y-6">
            
            <div class="bg-gradient-to-br from-blue-900 to-blue-800 rounded-xl shadow-lg text-white p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-white opacity-5 rounded-full blur-2xl"></div>
                
                <h2 class="text-xl font-semibold mb-4 border-b border-blue-700 pb-2">Quote Summary</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4 text-sm" id="quoteBreakdown">
                    </div>

                <div class="border-t border-blue-700 pt-4 mt-4 flex justify-between items-end">
                    <div>
                        <p class="text-blue-200 text-sm">Total Premium (for <span id="summaryTerm">1</span> yr)</p>
                        <p class="text-xs text-blue-300/70 mt-1">Excludes 18% GST (applicable at billing)</p>
                    </div>
                    <div class="text-right">
                        <p class="text-4xl font-bold tracking-tight" id="finalPremium">₹ 0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[calc(100%-250px)] min-h-[400px]">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-800">Dynamic Benefits Guide</h2>
                    <p class="text-xs text-slate-500 mt-1">Limits shown based on ₹ <span id="displaySi">5,00,000</span> Sum Insured under <span id="displayPlan" class="capitalize font-semibold text-blue-600">Basic</span> Plan.</p>
                </div>
                
                <div class="p-6 overflow-y-auto flex-1 space-y-6" id="benefitsContainer">
                    </div>
            </div>

        </div>
    </main>

    <script>
        // --- 1. PREMIUM DATA MATRICES ---
        const premiumData = {
            zone1: {
                basic: {
                    500000: [3637, 5180, 6265, 7905, 10402, 12454, 16054, 18120, 24539, 27751],
                    1000000: [4460, 6363, 7709, 9738, 12819, 15353, 19803, 22356, 30285, 34254],
                    1500000: [5549, 7933, 9616, 12160, 16017, 19191, 24763, 27957, 37891, 42860],
                    2500000: [7457, 10687, 12964, 16400, 21622, 25918, 33454, 37779, 51215, 57937],
                    5000000: [10364, 14876, 18060, 22861, 30163, 36166, 46699, 52739, 71523, 80915],
                    7500000: [11720, 16830, 20434, 25871, 34142, 40939, 52865, 59709, 80980, 91621],
                    10000000: [12679, 18214, 22122, 28008, 36965, 44324, 57245, 64655, 87694, 99218]
                },
                gold: {
                    500000: [4282, 6087, 7195, 8878, 12118, 14067, 17760, 19607, 26194, 29471],
                    1000000: [5086, 7452, 8826, 10907, 14689, 17111, 21673, 23997, 32127, 36170],
                    1500000: [6213, 9289, 11005, 13609, 18190, 21239, 26947, 29878, 40060, 45128],
                    2500000: [8443, 12828, 15142, 18653, 24955, 29036, 36755, 40649, 54417, 61271],
                    5000000: [11846, 18466, 21697, 26587, 35530, 41131, 51907, 57199, 76436, 86011],
                    7500000: [13399, 20893, 24548, 30088, 40214, 46558, 58760, 64758, 86544, 97394],
                    10000000: [14493, 22613, 26573, 32571, 43543, 50411, 63627, 70125, 93715, 105468]
                },
                platinum: {
                    500000: [4366, 7891, 8990, 10664, 13899, 15638, 19326, 20832, 27414, 30691],
                    1000000: [5161, 9126, 10491, 12557, 16330, 18555, 23113, 25119, 33249, 37292],
                    1500000: [6293, 10991, 12688, 15283, 19850, 22702, 28401, 31009, 41191, 46259],
                    2500000: [8551, 14703, 16998, 20495, 26778, 30640, 38354, 41893, 55656, 62509],
                    5000000: [11968, 20425, 23632, 28503, 37428, 42800, 53566, 58489, 77722, 87296],
                    7500000: [13534, 23104, 26736, 32258, 42360, 48447, 60639, 66221, 88002, 98848],
                    10000000: [14642, 25007, 28943, 34918, 45866, 52454, 65660, 71705, 95291, 107043]
                }
            },
            zone2: {
                basic: {
                    500000: [2976, 4238, 5126, 6468, 8511, 10190, 13135, 14826, 20077, 22705],
                    1000000: [3649, 5206, 6307, 7967, 10488, 12561, 16203, 18291, 24778, 28026],
                    1500000: [4540, 6491, 7868, 9949, 13104, 15702, 20261, 22874, 31002, 35068],
                    2500000: [6101, 8744, 10607, 13418, 17691, 21206, 27372, 30910, 41903, 47403],
                    5000000: [8480, 12171, 14776, 18704, 24679, 29590, 38208, 43150, 58519, 66203],
                    7500000: [9589, 13770, 16719, 21168, 27934, 33496, 43253, 48853, 66257, 74962],
                    10000000: [10373, 14902, 18100, 22916, 30244, 36265, 46837, 52900, 71749, 81178]
                },
                gold: {
                    500000: [3504, 4980, 5887, 7264, 9914, 11509, 14531, 16042, 21431, 24113],
                    1000000: [4162, 6097, 7222, 8924, 12018, 14000, 17733, 19634, 26285, 29594],
                    1500000: [5083, 7600, 9004, 11135, 14883, 17377, 22047, 24446, 32776, 36923],
                    2500000: [6908, 10496, 12389, 15262, 20418, 23757, 30072, 33258, 44523, 50130],
                    5000000: [9693, 15109, 17752, 21753, 29070, 33652, 42469, 46799, 62539, 70372],
                    7500000: [10962, 17094, 20085, 24618, 32903, 38093, 48076, 52984, 70808, 79686],
                    10000000: [11858, 18502, 21741, 26649, 35626, 41245, 52058, 57375, 76676, 86292]
                },
                platinum: {
                    500000: [3573, 6457, 7355, 8725, 11372, 12795, 15813, 17044, 22430, 25111],
                    1000000: [4223, 7466, 8583, 10274, 13361, 15181, 18911, 20552, 27203, 30512],
                    1500000: [5148, 8993, 10381, 12504, 16241, 18574, 23237, 25371, 33702, 37848],
                    2500000: [6996, 12030, 13908, 16769, 21910, 25069, 31380, 34276, 45537, 51144],
                    5000000: [9792, 16711, 19335, 23321, 30623, 35018, 43827, 47855, 63591, 71424],
                    7500000: [11073, 18903, 21875, 26393, 34658, 39638, 49614, 54181, 72002, 80876],
                    10000000: [11980, 20460, 23681, 28569, 37527, 42917, 53722, 58668, 77965, 87581]
                }
            }
        };

        // --- 2. STATE MANAGEMENT & DOM ELEMENTS ---
        const state = {
            members: [{ id: 1, role: 'Self', age: 30 }],
            memberRoles: ['Self', 'Spouse', 'Dependent Child 1', 'Dependent Child 2'],
            maxMembers: 4
        };

        const DOM = {
            zone: document.getElementById('zone'),
            sumInsured: document.getElementById('sumInsured'),
            term: document.getElementById('term'),
            planRadios: document.getElementsByName('plan'),
            membersContainer: document.getElementById('membersContainer'),
            addMemberBtn: document.getElementById('addMemberBtn'),
            validationNotices: document.getElementById('validationNotices'),
            quoteBreakdown: document.getElementById('quoteBreakdown'),
            finalPremium: document.getElementById('finalPremium'),
            summaryTerm: document.getElementById('summaryTerm'),
            displaySi: document.getElementById('displaySi'),
            displayPlan: document.getElementById('displayPlan'),
            benefitsContainer: document.getElementById('benefitsContainer'),
            radioGold: document.getElementById('radio-gold'),
            radioPlatinum: document.getElementById('radio-platinum'),
            uiGold: document.getElementById('ui-gold'),
            uiPlatinum: document.getElementById('ui-platinum')
        };

        // --- 3. HELPER FUNCTIONS ---
        const formatINR = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

        const getAgeIndex = (age) => {
            if (age >= 0 && age <= 17) return 0;
            if (age >= 18 && age <= 30) return 1;
            if (age >= 31 && age <= 35) return 2;
            if (age >= 36 && age <= 40) return 3;
            if (age >= 41 && age <= 45) return 4;
            if (age >= 46 && age <= 50) return 5;
            if (age >= 51 && age <= 55) return 6;
            if (age >= 56 && age <= 60) return 7;
            if (age >= 61 && age <= 65) return 8;
            return 9; // 66-70 and used as base for > 70
        };

        const getActivePlan = () => Array.from(DOM.planRadios).find(r => r.checked).value;

        // --- 4. RENDER MEMBERS UI ---
        function renderMembers() {
            DOM.membersContainer.innerHTML = state.members.map((m, index) => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg">
                    <div class="flex-1">
                        <select onchange="updateMember(${m.id}, 'role', this.value)" class="w-full bg-transparent text-sm font-medium focus:outline-none text-slate-800">
                            ${state.memberRoles.map(role => `<option value="${role}" ${m.role === role ? 'selected' : ''}>${role}</option>`).join('')}
                        </select>
                    </div>
                    <div class="w-24">
                        <div class="flex items-center border rounded bg-white overflow-hidden">
                            <input type="number" min="0" max="100" value="${m.age}" onchange="updateMember(${m.id}, 'age', this.value)" class="w-full p-1.5 text-center text-sm focus:outline-none focus:bg-blue-50" placeholder="Age">
                            <span class="text-xs text-slate-500 pr-2">Yrs</span>
                        </div>
                    </div>
                    ${index > 0 ? `<button onclick="removeMember(${m.id})" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg></button>` : '<div class="w-7"></div>'}
                </div>
            `).join('');

            DOM.addMemberBtn.style.display = state.members.length >= state.maxMembers ? 'none' : 'flex';
            calculateQuote();
        }

        window.updateMember = (id, field, value) => {
            const member = state.members.find(m => m.id === id);
            if (field === 'age') member.age = parseInt(value) || 0;
            if (field === 'role') member.role = value;
            calculateQuote();
        };

        window.removeMember = (id) => {
            state.members = state.members.filter(m => m.id !== id);
            renderMembers();
        };

        DOM.addMemberBtn.addEventListener('click', () => {
            if (state.members.length < state.maxMembers) {
                const nextRole = state.memberRoles.find(r => !state.members.some(m => m.role === r)) || 'Spouse';
                state.members.push({ id: Date.now(), role: nextRole, age: 30 });
                renderMembers();
            }
        });

        // --- 5. CORE LOGIC & CALCULATIONS ---
        function calculateQuote() {
            const zone = DOM.zone.value;
            let plan = getActivePlan();
            const si = DOM.sumInsured.value;
            const term = parseInt(DOM.term.value);
            
            let notices = [];
            DOM.validationNotices.innerHTML = '';

            // Guardrail 1: Age > 60 forces Basic Plan
            const hasElderly = state.members.some(m => m.age > 60);
            if (hasElderly) {
                DOM.radioGold.disabled = true;
                DOM.radioPlatinum.disabled = true;
                DOM.uiGold.classList.add('opacity-40', 'cursor-not-allowed');
                DOM.uiPlatinum.classList.add('opacity-40', 'cursor-not-allowed');
                
                if (plan !== 'basic') {
                    DOM.planRadios[0].checked = true; // Force Basic
                    plan = 'basic';
                    notices.push(`<div class="p-2 bg-yellow-50 text-yellow-800 text-sm rounded border border-yellow-200 flex gap-2"><svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg> Note: Age > 60 detected. Plan restricted strictly to Basic variant.</div>`);
                }
            } else {
                DOM.radioGold.disabled = false;
                DOM.radioPlatinum.disabled = false;
                DOM.uiGold.classList.remove('opacity-40', 'cursor-not-allowed');
                DOM.uiPlatinum.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            // Guardrail 2: Platinum Minimum 2 Adults Rule
            const adultsCount = state.members.filter(m => m.age >= 18).length;
            if (plan === 'platinum' && adultsCount < 2) {
                notices.push(`<div class="p-2 bg-red-50 text-red-800 text-sm rounded border border-red-200 flex gap-2"><svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg> Platinum Plan requires a minimum of 2 Adults (Age 18+). Please add members or select another plan.</div>`);
            }

            if(notices.length > 0) {
                DOM.validationNotices.innerHTML = notices.join('');
            }

            // Calculations
            let totalBasePremium = 0;
            let memberBreakdownHtml = '';

            state.members.forEach(m => {
                const baseArray = premiumData[zone][plan][si];
                const ageIndex = getAgeIndex(m.age);
                let memberPremium = baseArray[ageIndex];

                // Guardrail 3: Age > 70 Loading (2.5% simple loading per year above 70 based on age 70 premium)
                if (m.age > 70) {
                    const extraYears = m.age - 70;
                    memberPremium = memberPremium + (extraYears * 0.025 * memberPremium);
                }

                totalBasePremium += memberPremium;
                memberBreakdownHtml += `<div class="flex justify-between text-blue-100"><span class="truncate pr-2">${m.role} (${m.age} yrs)</span><span>${formatINR(memberPremium)}</span></div>`;
            });

            // Member Discount
            let memDiscountPct = 0;
            if (state.members.length === 2) memDiscountPct = 0.05;
            else if (state.members.length === 3) memDiscountPct = 0.10;
            else if (state.members.length >= 4) memDiscountPct = 0.15;
            
            const postMemDiscount = totalBasePremium * (1 - memDiscountPct);

            // Term Discount
            let termDiscountPct = 0;
            if (term === 2) termDiscountPct = 0.05;
            else if (term === 3) termDiscountPct = 0.07;

            // Total Annualized * term * (1 - termDiscount)
            let finalPremium = (postMemDiscount * term) * (1 - termDiscountPct);

            // Render Quote
            DOM.quoteBreakdown.innerHTML = `
                <div class="col-span-2 space-y-1 mb-2 border-b border-blue-700 pb-3">
                    <p class="text-xs font-semibold text-blue-300 uppercase tracking-wider mb-1">Base Premiums</p>
                    ${memberBreakdownHtml}
                    <div class="flex justify-between font-medium pt-1 mt-1 border-t border-blue-700/50"><span>Base Total</span><span>${formatINR(totalBasePremium)}</span></div>
                </div>
                <div>
                    <span class="block text-blue-300">Member Discount</span>
                    <span class="font-medium text-green-300">-${memDiscountPct * 100}%</span>
                </div>
                <div>
                    <span class="block text-blue-300">Term Discount</span>
                    <span class="font-medium text-green-300">-${termDiscountPct * 100}%</span>
                </div>
            `;
            
            // If invalid configuration (e.g. Platinum without 2 adults), zero out premium to force correction
            if (plan === 'platinum' && adultsCount < 2) {
                DOM.finalPremium.innerText = "Invalid Config";
                DOM.finalPremium.classList.add('text-red-300', 'text-2xl');
            } else {
                DOM.finalPremium.innerText = formatINR(Math.round(finalPremium));
                DOM.finalPremium.classList.remove('text-red-300', 'text-2xl');
            }

            DOM.summaryTerm.innerText = term;
            updateBenefitsUI(parseInt(si), plan);
        }

        // --- 6. BENEFITS ENGINE ---
        function updateBenefitsUI(si, plan) {
            DOM.displaySi.innerText = new Intl.NumberFormat('en-IN').format(si);
            DOM.displayPlan.innerText = plan;

            // Compute dynamic values
            const roomLimit = si <= 1500000 ? "Single AC Room" : "Deluxe AC Room";
            const hospCash = si <= 1500000 ? "₹ 500/day" : (si === 2500000 ? "₹ 750/day" : (si === 5000000 ? "₹ 1,000/day" : (si === 7500000 ? "₹ 1,500/day" : "₹ 2,000/day")));
            const ambulance = si <= 1500000 ? "₹ 5,000" : (si === 2500000 ? "₹ 7,500" : (si === 5000000 ? "₹ 10,000" : (si === 7500000 ? "₹ 15,000" : "₹ 20,000")));
            const cataract = si <= 1500000 ? "₹ 50,000" : (si === 2500000 ? "₹ 75,000" : (si === 5000000 ? "₹ 1,00,000" : (si === 7500000 ? "₹ 1,25,000" : "₹ 1,50,000")));
            const hazardous = si <= 1500000 ? "₹ 1,00,000" : (si === 2500000 ? "₹ 1,50,000" : (si === 5000000 ? "₹ 2,00,000" : (si === 7500000 ? "₹ 2,50,000" : "₹ 3,00,000")));
            const healthCheck = si <= 1500000 ? "₹ 3,500" : (si === 2500000 ? "₹ 5,000" : (si === 5000000 ? "₹ 7,000" : (si === 7500000 ? "₹ 8,000" : "₹ 10,000")));
            const secondOp = si <= 1500000 ? "₹ 5,000" : (si === 2500000 ? "₹ 7,500" : (si === 5000000 ? "₹ 10,000" : (si === 7500000 ? "₹ 15,000" : "₹ 20,000")));
            
            // Base Block
            let html = `
                <div>
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Base Coverages</h3>
                    <ul class="space-y-3 text-sm">
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Room Rent Limit:</span> ${roomLimit}</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Hospital Cash (Max 5 days):</span> ${hospCash}</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Road Ambulance Limit:</span> Max ${ambulance}</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Cataract (Per eye):</span> Max ${cataract}</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Hazardous Sports:</span> Max ${hazardous}</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Preventive Health Check-up:</span> Max ${healthCheck} (Every 2 claim-free years)</div></li>
                        <li class="flex items-start"><svg class="h-5 w-5 text-green-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><div><span class="font-medium text-slate-800">Medical Second Opinion:</span> Max ${secondOp}</div></li>
                    </ul>
                </div>
            `;

            // Gold Block
            if (plan === 'gold' || plan === 'platinum') {
                const criticalCare = si <= 1500000 ? "₹ 1,00,000" : (si === 2500000 ? "₹ 1,50,000" : (si === 5000000 ? "₹ 2,50,000" : (si === 7500000 ? "₹ 5,00,000" : "₹ 10,00,000")));
                const airAmbulance = si <= 1500000 ? "₹ 50,000" : (si === 2500000 ? "₹ 75,000" : (si === 5000000 ? "₹ 1,00,000" : (si === 7500000 ? "₹ 1,50,000" : "₹ 2,00,000")));
                
                html += `
                    <div class="pt-4 border-t border-slate-100">
                        <h3 class="text-sm font-bold text-yellow-500 uppercase tracking-wider mb-3">Gold Features</h3>
                        <ul class="space-y-3 text-sm">
                            <li class="flex items-start"><svg class="h-5 w-5 text-yellow-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><div><span class="font-medium text-slate-800">Critical Care Benefit:</span> Lump sum ${criticalCare}</div></li>
                            <li class="flex items-start"><svg class="h-5 w-5 text-yellow-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><div><span class="font-medium text-slate-800">Air Ambulance Charges:</span> Max ${airAmbulance}</div></li>
                        </ul>
                    </div>
                `;
            }

            // Platinum Block
            if (plan === 'platinum') {
                const matSingle = si <= 5000000 ? "₹ 25,000" : (si === 7500000 ? "₹ 37,500" : "₹ 50,000");
                const matTwins = si <= 5000000 ? "₹ 37,500" : (si === 7500000 ? "₹ 50,000" : "₹ 62,500");
                const infertility = si <= 1500000 ? "₹ 50,000" : (si === 2500000 ? "₹ 75,000" : (si === 5000000 ? "₹ 1,00,000" : (si === 7500000 ? "₹ 1,50,000" : "₹ 2,00,000")));
                const wellBaby = si <= 1500000 ? "₹ 30,000" : (si === 2500000 ? "₹ 40,000" : (si === 5000000 ? "₹ 50,000" : (si === 7500000 ? "₹ 75,000" : "₹ 1,00,000")));
                const birthRight = si <= 1500000 ? "₹ 30,000" : (si === 2500000 ? "₹ 40,000" : (si === 5000000 ? "₹ 50,000" : (si === 7500000 ? "₹ 75,000" : "₹ 1,00,000")));
                
                html += `
                    <div class="pt-4 border-t border-slate-100">
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-3">Platinum Features</h3>
                        <ul class="space-y-3 text-sm">
                            <li class="flex items-start"><svg class="h-5 w-5 text-slate-700 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg><div><span class="font-medium text-slate-800">Maternity Coverage:</span> ${matSingle} (Single) / ${matTwins} (Twins)</div></li>
                            <li class="flex items-start"><svg class="h-5 w-5 text-slate-700 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg><div><span class="font-medium text-slate-800">Infertility Treatment:</span> Max ${infertility} (Lifetime)</div></li>
                            <li class="flex items-start"><svg class="h-5 w-5 text-slate-700 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg><div><span class="font-medium text-slate-800">Well Baby Cover (Pre-term):</span> Max ${wellBaby}</div></li>
                            <li class="flex items-start"><svg class="h-5 w-5 text-slate-700 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg><div><span class="font-medium text-slate-800">Birth Right Benefit:</span> Lump sum ${birthRight}</div></li>
                        </ul>
                    </div>
                `;
            }

            DOM.benefitsContainer.innerHTML = html;
        }

        // --- 7. EVENT LISTENERS & INIT ---
        [DOM.zone, DOM.sumInsured, DOM.term].forEach(el => el.addEventListener('change', calculateQuote));
        DOM.planRadios.forEach(el => el.addEventListener('change', calculateQuote));

        // Initial Render
        renderMembers();
    </script>
</body>
</html>
